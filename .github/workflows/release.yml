name: Release

# Cut a stable release from a version tag (v1.2.0 or 1.2.0): runs the SAME reusable build pipelines as
# nightly (build.yml, build-linux.yml, build-macos.yml — no gate, this is already-merged code) and attaches
# the packaged Windows ZIP, Linux AppImage and macOS DMG to the tag's release:
# - a release already made for the tag (GitHub's "Draft a new release" page creates the tag as it
#   publishes) gets the files added to it;
# - a tag pushed on its own gets a new DRAFT release, to review/edit notes before publishing.
# macOS does not hold the release back: if its build fails, the release goes without the DMG.
# Run it by hand (Actions > Release > Run workflow) with a tag to (re)build that tag's files.
# See docs/UPSTREAM_MERGES.md.

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build and attach to its release (e.g. 1.1.3)
        required: true
        type: string

jobs:
  windows:
    uses: ./.github/workflows/build.yml
    with:
      release_zip: true # the publish job below attaches this artifact as the Release asset
      ref: ${{ inputs.tag }} # empty on a tag push: the pushed tag

  linux:
    uses: ./.github/workflows/build-linux.yml
    with:
      ref: ${{ inputs.tag }}

  macos:
    uses: ./.github/workflows/build-macos.yml
    with:
      ref: ${{ inputs.tag }}

  publish:
    needs: [windows, linux, macos]
    if: ${{ !cancelled() && needs.windows.result == 'success' && needs.linux.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Download packaged ZIP
        uses: actions/download-artifact@v4
        with:
          name: ComboShip-package-zip
          path: dist

      - name: Download Linux AppImage
        uses: actions/download-artifact@v4
        with:
          name: ComboShip-linux-appimage
          path: dist

      - name: Download macOS DMG
        if: needs.macos.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: ComboShip-macos
          path: dist

      - name: Name the assets after the tag
        shell: bash
        run: |
          set -euo pipefail
          zip=$(ls dist/*.zip | head -1)
          mv "$zip" "dist/ComboShip-${TAG}-windows.zip"
          appimage=$(ls dist/ComboShip-*-linux-x86_64.AppImage | head -1)
          mv "$appimage" "dist/ComboShip-${TAG}-linux-x86_64.AppImage"
          shopt -s nullglob
          dmgs=(dist/*.dmg)
          if ((${#dmgs[@]})); then
            mv "${dmgs[0]}" "dist/ComboShip-${TAG}-macos.dmg"
          fi

      # A release made on GitHub's release page already exists (published or draft): add the files to it, as
      # they are, rather than letting the draft step below edit it (it would turn a published release back
      # into a draft).
      - name: Attach to the tag's existing release
        id: existing
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            shopt -s nullglob
            gh release upload "$TAG" dist/ComboShip-"$TAG"-* --clobber --repo "$GITHUB_REPOSITORY"
            echo "attached=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish draft release
        if: steps.existing.outputs.attached != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          draft: true
          fail_on_unmatched_files: false # the DMG is absent when the macOS build failed
          generate_release_notes: true
          files: |
            dist/ComboShip-${{ env.TAG }}-windows.zip
            dist/ComboShip-${{ env.TAG }}-linux-x86_64.AppImage
            dist/ComboShip-${{ env.TAG }}-macos.dmg
